proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn:50m inactive=30m max_size=1g;

server {
    listen 80;

    location = /authz {
        internal;
        proxy_pass http://bionicpro-auth:8080/api/reports/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location /reports/ {
        auth_request /authz;

        proxy_pass http://garage:3902/;
        proxy_set_header Host reports.web.garage;
        proxy_cache cdn;
        proxy_cache_key $uri;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;

        add_header Access-Control-Allow-Origin "http://localhost:3000" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }
}